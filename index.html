<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avsar Shukla — Portfolio</title>
<style>
  :root {
    --bg: #0d0d0f;
    --ink: #ffffff;
    --muted: #8a8a93;
    --accent: #ff6b35;
    --frame-a: #dcefff;
    --frame-b: #8fbbe8;
    --frame-c: #f2f9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
  }

  .side-nav {
    position: fixed; right: 6vw; top: 50%; transform: translateY(-50%);
    text-align: right; z-index: 30;
  }
  .side-nav h1 {
    font-size: clamp(26px, 2.4vw, 38px); font-weight: 800; letter-spacing: -.5px; margin-bottom: 34px;
  }

  .stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    perspective: 1600px; z-index: 10;
    touch-action: none;
  }
  .phone-wrap { transform: scale(var(--s, 1)); }
  .phone {
    position: relative; width: 300px; height: 618px;
    transform-style: preserve-3d;
    transform: rotateY(var(--ry, 0deg));
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .phone:active { cursor: grabbing; }
  .phone::before {
    content: ""; position: absolute; inset: -8px; border-radius: 56px;
    background: linear-gradient(145deg, var(--accent), transparent 45%, var(--accent));
    filter: blur(14px); opacity: .55; z-index: -1;
  }

  .face {
    position: absolute; inset: 0; border-radius: 52px;
    backface-visibility: hidden; overflow: hidden;
    background: linear-gradient(150deg, var(--frame-c), var(--frame-b) 45%, var(--frame-a));
    padding: 9px;
    box-shadow: 0 40px 80px rgba(0,0,0,.55);
    transform: translateZ(0);
  }
  .face.back { transform: rotateY(180deg); }

  .screen {
    width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative;
    background: #000 url('iPhone 15 Wallpaper.png') center / cover no-repeat;
    image-rendering: -webkit-optimize-contrast;
    display: flex; flex-direction: column; justify-content: space-between;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .screen::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(0,0,0,0.10), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(0,0,0,0.25), transparent 60%);
    pointer-events: none; z-index: 1;
  }

  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 92px; height: 26px; background: #000; border-radius: 20px; z-index: 5;
  }
  .status {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px 0; font-size: 12px; font-weight: 700; letter-spacing: .3px;
    color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); z-index: 4;
  }
  .status .right { display: flex; align-items: center; gap: 5px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
  .bars i { width: 3px; background: #fff; border-radius: 1px; display: block; }
  .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 6px; }
  .bars i:nth-child(3) { height: 8px; } .bars i:nth-child(4) { height: 10px; }
  .wifi { width: 13px; height: 10px; background: #fff; clip-path: polygon(50% 100%, 0 35%, 15% 20%, 50% 58%, 85% 20%, 100% 35%); }
  .batt { width: 22px; height: 11px; border: 1.5px solid #fff; border-radius: 3px; position: relative; }
  .batt::before { content: ""; position: absolute; inset: 1.5px; background: #fff; border-radius: 1px; }
  .batt::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 5px; background: #fff; border-radius: 0 2px 2px 0; }

  .home {
    padding: 12px 16px 0; display: grid;
    grid-template-columns: repeat(4, 1fr); gap: 14px 10px;
    align-content: start; z-index: 4;
  }

  .app-item {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    text-decoration: none; color: inherit; cursor: pointer;
    height: 72px;
    border: 0; background: transparent; padding: 0;
    font: inherit;
  }
  .tile {
    width: 50px; height: 50px; border-radius: 13px; position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
    transition: transform .2s, box-shadow .2s;
    flex-shrink: 0;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
  }
  .app-item:hover .tile { transform: translateY(-2px) translateZ(0); box-shadow: 0 8px 18px rgba(0,0,0,.5); }
  .tile svg {
    width: 28px; height: 28px; fill: currentColor;
    shape-rendering: geometricPrecision;
    display: block;
  }

  .lbl {
    margin-top: 4px; font-size: 9.5px; font-weight: 500; color: #ffffff;
    letter-spacing: .1px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58px;
    line-height: 1.1;
  }

  a.pixel-w {
    display: grid;
    grid-column: span 4;
    height: 88px;
    background: rgba(18, 20, 26, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 9px;
    gap: 2.5px;
    grid-template-columns: repeat(20, 1fr);
    grid-template-rows: repeat(8, 1fr);
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    transform: translateZ(0);
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
  }
  a.pixel-w:hover { transform: translateY(-2px) translateZ(0); box-shadow: 0 8px 18px rgba(0,0,0,.5); }
  .pixel-w span { border-radius: 1.5px; background: #122218; }

  .weather-wrap { grid-column: span 2; height: 114px; }
  .weather {
    width: 100%; height: 114px;
    background: #1c1f24;
    color: #ffffff; border-radius: 18px; padding: 11px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    position: relative; overflow: hidden;
    transform: translateZ(0);
  }
  .weather .top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; font-weight: 600; letter-spacing: .3px;
    text-transform: uppercase; color: #8a8f96;
  }
  .weather .temp-main { display: flex; align-items: baseline; gap: 2px; margin-top: 2px; }
  .weather .temp-main h3 { font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1; color: #ffffff; }
  .weather .temp-main span { font-size: 12px; font-weight: 600; color: #a8aeb6; }
  .weather .condition { font-size: 9.5px; font-weight: 500; color: #b8bec6; margin-top: -2px; }
  .weather .footer {
    display: flex; justify-content: space-between;
    font-size: 8px; color: #7d838b; font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.08); padding-top: 4px;
  }

  .a-linkedin { background: #0077b5; color: #fff; }
  .a-notes { background: linear-gradient(180deg, #fef08a 0 32%, #eab308 32% 100%); color: #333; }
  .a-settings { background: linear-gradient(180deg, #9ca3af, #4b5563); color: #fff; }
  .a-x { background: #000000; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .a-store { background: linear-gradient(180deg, #38bdf8, #0284c7); color: #fff; }
  .a-msg { background: linear-gradient(180deg, #4ade80, #16a34a); color: #fff; }
  .a-files { background: linear-gradient(180deg, #38bdf8, #2563eb); color: #fff; }

  .photos { background: #ffffff; position: relative; overflow: hidden; }
  .photos::before {
    content: ""; position: absolute; inset: 7px; border-radius: 50%;
    background: conic-gradient(#ef4444, #f97316, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ec4899, #ef4444);
  }
  .photos::after {
    content: ""; position: absolute; inset: 15px; border-radius: 50%; background: #ffffff;
  }

  .search {
    margin: 4px auto 6px; width: 140px; height: 22px; border-radius: 12px;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    gap: 5px; font-size: 9.5px; color: #ffffff; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5); z-index: 4;
    transform: translateZ(0);
  }
  .dock {
    margin: 0 10px 14px; height: 64px; border-radius: 22px;
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 4;
    transform: translateZ(0);
  }
  .dock .tile { cursor: pointer; }

  .back-shell {
    width: 100%; height: 100%; border-radius: 44px; position: relative;
    background:
      linear-gradient(155deg, rgba(255,255,255,.55), rgba(255,255,255,0) 42%),
      linear-gradient(150deg, #cfe6ff, #8fbcf2 55%, #b9dcff);
  }
  .cam {
    position: absolute; top: 16px; left: 16px; width: 118px; height: 118px; border-radius: 34px;
    background: linear-gradient(150deg, #e8f3ff, #a9cdf3);
    box-shadow: inset 0 1px 3px rgba(255,255,255,.9), 0 4px 12px rgba(0,0,0,.18);
  }
  .lens {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a6270, #1b2028 60%, #0a0d12);
    border: 3px solid #cfe2f7; box-shadow: 0 2px 5px rgba(0,0,0,.35);
  }
  .lens::after { content: ""; position: absolute; top: 8px; left: 9px; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .lens.l1 { top: 12px; left: 12px; }
  .lens.l2 { bottom: 12px; left: 52px; }
  .flash { position: absolute; top: 20px; right: 18px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #fff9d8, #e8d9a2); }
  .mic { position: absolute; bottom: 34px; right: 24px; width: 8px; height: 8px; border-radius: 50%; background: #6d829b; }
  .apple {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 76px; height: 76px; opacity: .5;
  }
  .apple svg { width: 100%; height: 100%; fill: #f6fbff; }

  .hint {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 9px; z-index: 30;
  }
  .hint .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  .msg-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fade .18s ease-out;
  }
  .msg-overlay[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .msg-sheet {
    width: 100%; max-width: 460px;
    background: #1c1c1e;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.65);
    overflow: hidden;
    display: flex; flex-direction: column;
    animation: pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .msg-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .msg-header h2 { font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: .2px; }
  .msg-close {
    width: 28px; height: 28px; border-radius: 50%;
    background: #2c2c2e; border: 0; color: #ffffff;
    font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .msg-close:hover { background: #3a3a3c; }

  .msg-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .msg-row label { font-size: 14px; font-weight: 500; color: #8e8e93; flex-shrink: 0; }
  .msg-row input {
    flex: 1;
    background: transparent; border: 0; outline: 0;
    color: #ffffff; font-size: 14px; font-family: inherit;
    padding: 4px 0;
  }
  .msg-row input::placeholder { color: #5a5a5e; }

  .msg-body {
    min-height: 130px; max-height: 260px; resize: none;
    background: transparent; border: 0; outline: 0;
    color: #ffffff; font-size: 14px; font-family: inherit;
    padding: 14px 16px;
    line-height: 1.4;
    flex: 1;
  }
  .msg-body::placeholder { color: #5a5a5e; }

  .msg-actions {
    display: flex; justify-content: flex-end;
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .msg-send {
    padding: 9px 20px; border-radius: 20px; border: 0;
    background: #0A84FF; color: #ffffff;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .msg-send:hover { background: #0a76e6; }
  .msg-send:active { transform: scale(.97); }
  .msg-send:disabled { background: #2c2c2e; color: #5a5a5e; cursor: default; }

  @media (max-width: 820px) {
    body { overflow-y: auto; overflow-x: hidden; }
    .side-nav {
      position: relative; right: auto; top: auto; transform: none;
      text-align: center; padding: 30px 20px 10px; z-index: 30;
    }
    .stage {
      position: relative; inset: auto; height: 580px; width: 100%;
      padding: 10px 0;
      touch-action: none;
    }
    .hint {
      position: relative; bottom: auto; left: auto; transform: none;
      justify-content: center; margin: 15px 0 30px;
    }
  }
</style>
</head>

<div class="msg-overlay" id="msgOverlay" hidden>
  <div class="msg-sheet" role="dialog" aria-modal="true" aria-label="New Message">
    <div class="msg-header">
      <h2>New Message</h2>
      <button class="msg-close" id="msgClose" aria-label="Close">✕</button>
    </div>
    <div class="msg-row">
      <label for="msgTo">To:</label>
      <input id="msgTo" type="text" placeholder="Recipients" autocomplete="off" />
    </div>
    <textarea class="msg-body" id="msgBody" placeholder="Type a message…"></textarea>
    <div class="msg-actions">
      <button class="msg-send" id="msgSend" disabled>Send</button>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     1. STATUS BAR — current India time, updates every 10 s
     ============================================================ */
  (function(){
    const el = document.getElementById('statusTime');
    function tick(){
      el.textContent = new Date().toLocaleTimeString('en-IN', {
        timeZone: 'Asia/Kolkata',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }
    tick();
    setInterval(tick, 10000);
  })();

  /* ============================================================
     2. KOLKATA WEATHER — live from Open-Meteo (no API key)
        Refreshes every 10 minutes. Silent-fails to last good values.
     ============================================================ */
  (function(){
    const LAT = 22.5726;
    const LON = 88.3639;

    const elTemp = document.getElementById('weatherTemp');
    const elCond = document.getElementById('weatherCondition');
    const elHL   = document.getElementById('weatherHL');
    const elAQI  = document.getElementById('weatherAQI');

    // WMO weather code → text
    const WMO = {
      0:'Clear', 1:'Mainly Clear', 2:'Partly Cloudy', 3:'Overcast',
      45:'Fog', 48:'Rime Fog',
      51:'Light Drizzle', 53:'Drizzle', 55:'Heavy Drizzle',
      56:'Freezing Drizzle', 57:'Freezing Drizzle',
      61:'Light Rain', 63:'Rain', 65:'Heavy Rain',
      66:'Freezing Rain', 67:'Freezing Rain',
      71:'Light Snow', 73:'Snow', 75:'Heavy Snow', 77:'Snow Grains',
      80:'Rain Showers', 81:'Rain Showers', 82:'Violent Showers',
      85:'Snow Showers', 86:'Heavy Snow Showers',
      95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm'
    };

    async function load(){
      try {
        const [wRes, aqRes] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
                `&current=temperature_2m,weather_code` +
                `&daily=temperature_2m_max,temperature_2m_min` +
                `&timezone=Asia%2FKolkata`),
          fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}` +
                `&current=us_aqi&timezone=Asia%2FKolkata`)
        ]);
        if (!wRes.ok || !aqRes.ok) throw new Error('bad response');

        const w = await wRes.json();
        const a = await aqRes.json();

        const t  = Math.round(w.current.temperature_2m);
        const hi = Math.round(w.daily.temperature_2m_max[0]);
        const lo = Math.round(w.daily.temperature_2m_min[0]);
        const code = w.current.weather_code;
        const aqi = Math.round(a.current.us_aqi);

        elTemp.textContent = t + '°';
        elCond.textContent = WMO[code] || 'Clear';
        elHL.textContent   = `H: ${hi}° L: ${lo}°`;
        elAQI.textContent  = 'AQI ' + aqi;
      } catch (_) {
        // keep last-known (or initial placeholder) values
      }
    }

    load();
    setInterval(load, 10 * 60 * 1000);
  })();

  /* ---------- pixel widget (GitHub contribution graph) ---------- */
  (function(){
    const w = document.getElementById('pixelW');
    const cells = 20 * 8;
    for(let i=0;i<cells;i++){
      const s=document.createElement('span');
      const r=Math.random();
      if(r>0.82) s.style.background='#3ddc84';
      else if(r>0.62) s.style.background='#1f7a45';
      else if(r>0.45) s.style.background='#123322';
      w.appendChild(s);
    }
    setInterval(()=>{
      const kids=w.children;
      for(let i=0;i<10;i++){
        const k=kids[Math.floor(Math.random()*kids.length)];
        const r=Math.random();
        k.style.background = r>0.82?'#3ddc84': r>0.62?'#1f7a45': r>0.45?'#123322':'#122218';
      }
    },700);
  })();

  /* ---------- Messages modal ---------- */
  (function(){
    const overlay = document.getElementById('msgOverlay');
    const openBtn = document.getElementById('msgApp');
    const closeBtn = document.getElementById('msgClose');
    const sendBtn  = document.getElementById('msgSend');
    const toInput  = document.getElementById('msgTo');
    const bodyInput= document.getElementById('msgBody');

    function open(){
      overlay.hidden = false;
      setTimeout(()=>toInput.focus(), 30);
    }
    function close(){
      overlay.hidden = true;
      toInput.value = '';
      bodyInput.value = '';
      sendBtn.disabled = true;
    }

    openBtn.addEventListener('click', (e)=>{ e.stopPropagation(); open(); });
    closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && !overlay.hidden) close(); });

    function syncSend(){ sendBtn.disabled = bodyInput.value.trim().length === 0; }
    toInput.addEventListener('input', syncSend);
    bodyInput.addEventListener('input', syncSend);

    sendBtn.addEventListener('click', () => {
      toInput.value = '';
      bodyInput.value = '';
      sendBtn.disabled = true;
      close();
    });
  })();

  /* ============================================================
     3. FLIP ROTATION — desktop (wheel / drag / keys) + mobile (touch)
        touch-action: none on .phone + .stage in CSS prevents the
        mobile browser from scrolling instead of dispatching pointermove.
     ============================================================ */
  const phone = document.getElementById('phone');
  let target = 0, current = 0, snapTimer = null;

  function snapSoon(){
    clearTimeout(snapTimer);
    snapTimer = setTimeout(()=>{ target = Math.round(target/180)*180; }, 130);
  }

  // Desktop wheel
  window.addEventListener('wheel', e=>{
    if (!document.getElementById('msgOverlay').hidden) return;
    e.preventDefault();
    target += e.deltaY * 0.35 + e.deltaX * 0.25;
    snapSoon();
  }, {passive:false});

  // Pointer / drag — works for mouse AND touch once touch-action: none is set
  let dragging=false, lastX=0;
  phone.addEventListener('pointerdown', e=>{
    if (e.target.closest('a, button, input, textarea')) return;
    dragging = true;
    lastX = e.clientX;
    try { phone.setPointerCapture(e.pointerId); } catch(_) {}
    clearTimeout(snapTimer);
  });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    target += (e.clientX - lastX) * 0.55;
    lastX = e.clientX;
  });
  window.addEventListener('pointerup',     ()=>{ dragging=false; snapSoon(); });
  window.addEventListener('pointercancel', ()=>{ dragging=false; snapSoon(); });

  // Keys
  window.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight') target += 180;
    if(e.key==='ArrowLeft')  target -= 180;
    snapSoon();
  });

  (function loop(){
    current += (target - current) * 0.1;
    phone.style.transform = `rotateY(${current}deg)`;
    requestAnimationFrame(loop);
  })();

  function fit(){
    const maxH = window.innerWidth <= 820 ? Math.min(window.innerHeight * 0.7, 520) : window.innerHeight * 0.82;
    const s = Math.min(1, maxH / 618);
    document.documentElement.style.setProperty('--s', s.toFixed(3));
  }
  fit(); window.addEventListener('resize', fit);
</script>
